[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-loop"
version = "0.1.0"
description = "Local two-engine idea research loop"
readme = "decision-graph.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
research-loop = "research_loop.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/research_loop"]
